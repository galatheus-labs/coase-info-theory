name: Build draft revision 1.3
on:
  push:
    branches: [draft/revision-1.3-economic-boundaries]
    paths:
      - scripts/apply_revision_1_3.py
      - scripts/align_companion_1_3.py
      - .github/workflows/draft-revision-1-3.yml
permissions:
  contents: write
concurrency:
  group: draft-revision-1-3
  cancel-in-progress: true
jobs:
  revise-and-build:
    if: github.ref == 'refs/heads/draft/revision-1.3-economic-boundaries'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/revision-1.3-economic-boundaries
          fetch-depth: 1
      - name: Check revision inputs are ready
        id: inputs
        shell: bash
        run: |
          if test -f scripts/apply_revision_1_3.py && test -f scripts/align_companion_1_3.py && test -f tests/model.test.cjs; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Revision input files are not yet complete; no changes made.'
          fi
      - name: Materialize reviewed draft
        if: steps.inputs.outputs.ready == 'true'
        run: |
          if ! grep -q 'draft revision 1.3, 2026-09-09' paper/coase-information-theory.tex; then
            python3 scripts/apply_revision_1_3.py
            python3 scripts/align_companion_1_3.py
          fi
      - name: Validate mathematics and companion
        if: steps.inputs.outputs.ready == 'true'
        run: node tests/model.test.cjs
      - name: Install TeX build dependencies
        if: steps.inputs.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Compile and validate paper
        if: steps.inputs.outputs.ready == 'true'
        run: |
          mkdir -p build
          latexmk -pdf -halt-on-error -interaction=nonstopmode -outdir=build paper/coase-information-theory.tex
          if grep -E 'undefined references|undefined citations|multiply defined' build/coase-information-theory.log; then exit 1; fi
          cp build/coase-information-theory.pdf paper/coase-information-theory.pdf
          pdftotext paper/coase-information-theory.pdf build/paper.txt
          grep -q 'Economic switching threshold' build/paper.txt
          mkdir -p build/previews
          pdftoppm -scale-to 1400 -png paper/coase-information-theory.pdf build/previews/page >/dev/null 2>&1
      - name: Commit generated revision only to the draft branch
        if: steps.inputs.outputs.ready == 'true'
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/draft/revision-1.3-economic-boundaries'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/coase-information-theory.tex paper/coase-information-theory.pdf paper/coase-information-theory-draft.md index.html README.md docs/
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize draft 1.3: economic boundaries, corrected assumptions, empirical design, and aligned demo'
            git push origin HEAD:refs/heads/draft/revision-1.3-economic-boundaries
          fi
      - uses: actions/upload-artifact@v4
        if: steps.inputs.outputs.ready == 'true' && always()
        with:
          name: coase-information-theory-draft-1.3
          path: |
            paper/coase-information-theory.tex
            paper/coase-information-theory.pdf
            build/*.log
            build/paper.txt
            build/previews/
          if-no-files-found: warn
